<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/cloud.css"><title>Cloud game-data runtime test</title></head>
<body><main id="cloudPanel" class="cloud-panel"></main><pre id="runtimeReport"></pre>
<script src="/adventure-store.js"></script><script src="/cloud-ui.js"></script><script>
(async()=>{
  const report=document.querySelector('#runtimeReport'),results=[],assert=(v,m)=>{if(!v)throw Error(m)},button=t=>[...document.querySelectorAll('button')].find(b=>b.textContent===t),tap=async b=>{assert(b,'Missing button');b.click();await new Promise(r=>setTimeout(r,0))};
  let resource=null,installed=false;
  const cloud={client:{auth:{onAuthStateChange(){}}},session:async()=>({user:{id:'fixture',email:'player@example.test'}}),resources:async()=>resource?[resource]:[],summary:async()=>({used_bytes:resource?693598:0,quota_bytes:104857600,adventures_bytes:0,history_bytes:0,game_data_bytes:resource?693598:0}),uploadGameData:async()=>{resource={id:'game',kind:'game_data',game:'ultima4',label:'Ultima IV game data',current_version:'version',current:{id:'version',stored_bytes:693598,created_at:new Date().toISOString(),device_name:'This browser'}};return {resource_id:'game',revision_id:'version'}},downloadGameData:async()=>'{"format":"fixture"}',history:async()=>[],signOut:async()=>{},deleteResource:async()=>{},deleteVersion:async()=>{}};
  const host={list:async()=>[],gameData:async()=>({available:true,label:'English DOS/EGA',logicalBytes:510817,text:'{"format":"fixture"}'}),installGameData:async()=>{installed=true;return {reloadRequired:true}},close(){}};
  const panel=new UltimatumCloudUI(document.querySelector('#cloudPanel'),host,cloud);await panel.refresh();
  panel.view='games';panel.render();assert(/Not saved to your account/.test(document.body.textContent),'Missing initial cloud state');results.push('local and cloud state are distinct');
  await tap(button('Save game data to cloud'));assert(panel.confirmation,'Upload did not ask for confirmation');await tap(document.querySelector('[data-cloud=confirm]'));while(panel.busy)await new Promise(r=>setTimeout(r,10));assert(resource&&/saved privately/i.test(document.querySelector('.cloud-status').textContent),'Private upload did not complete');results.push('private upload is explicit and confirmed');
  await tap(button('Download cloud copy'));assert(panel.confirmation,'Download did not ask before replace');await tap(document.querySelector('[data-cloud=confirm]'));while(panel.busy)await new Promise(r=>setTimeout(r,10));assert(installed&&/Reopen the game/.test(document.querySelector('.cloud-status').textContent),'Verified install/reload state missing');results.push('download replacement is confirmed and reports reload');
  panel.view='storage';panel.render();assert(/Game data/.test(document.querySelector('.account-view').textContent)&&/677/.test(document.querySelector('.account-view').textContent),'Storage does not account for game data');results.push('storage includes private game data');
  report.textContent=JSON.stringify({status:'passed',results},null,2);report.dataset.status='passed';
})().catch(error=>{document.querySelector('#runtimeReport').textContent=JSON.stringify({status:'failed',error:error.message},null,2);document.querySelector('#runtimeReport').dataset.status='failed'});
</script></body></html>
